name: FedOps PyPI release

on:
  push:
    branches: [main]
  pull_request:
    paths: ['src/python/**', '.github/workflows/pypi-release.yml', 'scripts/release/**']
  workflow_dispatch:

permissions:
  contents: read

# X server publishes only revisions with this workflow's successful push run.
concurrency:
  group: fedops-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Host bridge regression tests
        working-directory: src/python
        env:
          PYTHONPATH: '.'
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -p test_agent_studio_cli.py

  test-build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: |
          python -m pip install build twine
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' flwr requests hydra-core boto3 optuna scikit-learn
      - name: Test release guard
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Test client, server evaluation, model contract and host CLI
        working-directory: src/python
        env:
          PYTHONPATH: '.'
        run: python -m unittest discover -s tests
      - name: Embed source identity and build once
        run: |
          python scripts/release/pypi_release.py stamp
          python -m build src/python --outdir dist
          python -m twine check dist/*
      - name: Install built wheel and smoke test CLI
        run: |
          python -m venv /tmp/fedops-wheel-smoke
          /tmp/fedops-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/fedops-wheel-smoke/bin/fedops --help
          /tmp/fedops-wheel-smoke/bin/fedops run agent-studio --dry-run
      - name: Check PyPI version and source alignment
        id: plan
        run: python scripts/release/pypi_release.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
